<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Neon Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="28" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Outer Energy Ring -->
  <circle cx="64" cy="64" r="46" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Bold HackX 'X' Blades -->
  <path d="M36 34 L92 94" stroke="url(#neonGrad)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" />
  <path d="M92 34 L36 94" stroke="url(#neonGrad)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" />

  <!-- Left 'H' hint bar for depth -->
  <rect x="20" y="44" width="6" height="40" rx="3" fill="#00E5FF" opacity="0.9" />

  <!-- Digital Circuit / Pixel Accents -->
  <rect x="100" y="42" width="6" height="6" rx="1.5" fill="#00E5FF" />
  <rect x="104" y="53" width="5" height="5" rx="1" fill="#8B5CF6" />
  <rect x="99" y="62" width="6" height="6" rx="1.5" fill="#3B82F6" />

  <!-- Center Energy Core Spark -->
  <circle cx="64" cy="64" r="5" fill="#FFFFFF" />
  <circle cx="64" cy="64" r="9" stroke="#00E5FF" stroke-width="2.5" opacity="0.9" />
</svg>
